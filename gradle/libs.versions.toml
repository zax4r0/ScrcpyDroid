dadb = { group = "dev.mobile", name = "dadb", version.ref = "dadb" }
libadb = { group = "com.github.MuntashirAkon", name = "libadb-android", version.ref = "libadb" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
